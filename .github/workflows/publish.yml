name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases must be dispatched from the main branch."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify the committed version is unpublished
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          lock_version=$(node -p "require('./package-lock.json').packages[''].version")

          if [[ "$package_version" != "$lock_version" ]]; then
            echo "::error::package.json ($package_version) and package-lock.json ($lock_version) versions differ. Commit matching versions before releasing."
            exit 1
          fi

          set +e
          registry_output=$(npm view "$package_name@$package_version" version --json 2>&1)
          registry_status=$?
          set -e

          if [[ $registry_status -eq 0 ]]; then
            echo "::error::$package_name@$package_version is already published. Commit a new version before releasing."
            exit 1
          fi

          if ! grep -q "E404" <<< "$registry_output"; then
            echo "::error::Could not verify whether $package_name@$package_version is published."
            printf '%s\n' "$registry_output" >&2
            exit "$registry_status"
          fi

          echo "Publishing committed version $package_name@$package_version."

      - name: Publish to npm
        run: npm publish --provenance --access public
